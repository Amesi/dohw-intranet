{% extends "templates/web.html" %}

{% block title %}New Circular — DoWH{% endblock %}

{% block page_content %}
<div class="cmp-page">

<div class="cmp-block">
    <p class="dt-caption cmp-crumb"><a href="/circulars">&larr; Back to Circulars</a> / New circular</p>
    <h1 class="dt-page-title">New Circular</h1>
</div>

<div class="cmp-block">
    <form method="POST" action="/circulars/new" class="cmp-form" id="composeForm">
        <div class="cmp-scope-lock">
            <span class="cmp-dot"></span>
            Posting as {{ wing_label or "your Wing" }} (locked)
        </div>

        <div class="cmp-row">
            <label class="dt-caption">Title</label>
            <input type="text" name="new_title" required class="dt-input" placeholder="Circular title">
        </div>

        <div class="cmp-row">
            <label class="dt-caption">Content</label>
            <div class="cmp-editor">
                <div class="cmp-toolbar">
                    <button type="button" class="cmp-tb" data-cmd="bold"><b>B</b></button>
                    <button type="button" class="cmp-tb" data-cmd="italic"><i>I</i></button>
                    <button type="button" class="cmp-tb" data-cmd="underline"><u>U</u></button>
                    <span class="cmp-tb-sep"></span>
                    <button type="button" class="cmp-tb" data-cmd="createlink">&#128279;</button>
                    <button type="button" class="cmp-tb" data-cmd="insertUnorderedList">&bull;&mdash;</button>
                    <button type="button" class="cmp-tb" data-cmd="insertOrderedList">1.</button>
                    <span class="cmp-tb-sep"></span>
                    <button type="button" class="cmp-tb" data-cmd="formatBlock" data-arg="blockquote">&ldquo;&rdquo;</button>
                </div>
                <div class="cmp-editor-body" id="editorBody" contenteditable="true" data-placeholder="Circular content"></div>
            </div>
            <textarea name="new_content" id="editorSource" class="cmp-hidden-source" required></textarea>
        </div>

        <div class="cmp-row-split">
            <div class="cmp-row">
                <label class="dt-caption">Classification</label>
                <select name="new_classification" class="dt-select">
                    <option value="For Information">For information</option>
                    <option value="For Action">For action</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="cmp-row">
                <label class="dt-caption">Tags</label>
                <input type="text" name="new_tags" class="dt-input" placeholder="e.g. roadworks, safety">
            </div>
        </div>

        <input type="hidden" name="submit_circular" value="1">
        <button type="submit" class="dt-btn-primary">Publish &rarr;</button>
    </form>
</div>

</div>

<script>
(function () {
    var body = document.getElementById('editorBody');
    var source = document.getElementById('editorSource');
    var form = document.getElementById('composeForm');

    document.querySelectorAll('.cmp-tb').forEach(function (btn) {
        btn.addEventListener('click', function () {
            body.focus();
            document.execCommand(btn.dataset.cmd, false, btn.dataset.arg || null);
        });
    });

    form.addEventListener('submit', function () {
        source.value = body.innerHTML;
    });
})();
</script>
{% endblock %}

{% block style %}
<style>
/* Page-specific layout not covered by the shared tokens.css/navigation.css
   foundation — see docs/design/content-mgmt.md for the decision record.
   Content editing uses the browser's native contenteditable + execCommand
   rather than Frappe's Desk-only Quill control (ControlTextEditor) — that
   control is bundled into the Desk JS bundle, not available as a
   lightweight standalone asset for portal/website pages, and pulling in
   the full Desk bundle for one field was judged too heavy. This keeps
   the same restraint as #18's "restyle, don't introduce a new library"
   decision by using zero external dependencies instead of a third-party
   editor. Real limitation: no formatting state indication on the
   toolbar buttons (e.g. Bold doesn't show as "active" mid-selection) —
   acceptable for a first pass, flagged rather than polished further. */

.cmp-page { max-width: 560px; }
.cmp-block + .cmp-block { margin-top: var(--space-5, 20px); }
.cmp-crumb { margin-bottom: 6px; }
.cmp-crumb a { color: var(--ink-muted, #7c7c7c); text-decoration: none; }
.cmp-crumb a:hover { color: var(--ink, #171717); }

.cmp-scope-lock {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-sans);
    font-size: 11.5px; padding: 6px 10px; border: 1px solid var(--border, #ededed);
    border-radius: 20px; background: #fafafa; color: var(--ink-secondary, #666); margin-bottom: var(--space-4, 16px);
}
.cmp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dowh-gold); }

.cmp-form { display: flex; flex-direction: column; gap: 14px; }
.cmp-row { display: flex; flex-direction: column; gap: 4px; }
.cmp-row-split { display: flex; gap: 12px; }
.cmp-row-split .cmp-row { flex: 1; }

.cmp-editor { border: 1px solid #dcdcdc; border-radius: 6px; overflow: hidden; }
.cmp-toolbar { display: flex; gap: 2px; padding: 5px 6px; background: #fafafa; border-bottom: 1px solid var(--border, #ededed); }
.cmp-tb {
    width: 26px; height: 26px; border: none; background: none; border-radius: 4px;
    color: var(--ink-secondary, #666); font-size: 12px; cursor: pointer; font-family: var(--font-sans);
}
.cmp-tb:hover { background: #eee; color: var(--ink, #171717); }
.cmp-tb-sep { width: 1px; background: #e0e0e0; margin: 3px 4px; }
.cmp-editor-body {
    min-height: 160px; padding: 10px 12px; font-family: var(--font-sans); font-size: 13px;
    color: var(--ink-secondary, #444); line-height: 1.6; outline: none;
}
.cmp-editor-body:empty:before { content: attr(data-placeholder); color: var(--ink-muted, #bbb); }
.cmp-editor-body blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--border, #ddd); color: var(--ink-muted, #777); }
.cmp-hidden-source { display: none; }

@media (max-width: 500px) {
    .cmp-row-split { flex-direction: column; }
}
</style>
{% endblock %}
