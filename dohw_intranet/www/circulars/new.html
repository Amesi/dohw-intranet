{% extends "templates/web.html" %}

{% block title %}New Circular — DoWH{% endblock %}

{% block page_content %}
<div class="cmp-page">

<div class="cmp-block">
    <p class="dt-caption cmp-crumb"><a href="/circulars">&larr; Back to Circulars</a> / New circular</p>
    <h1 class="dt-page-title">New Circular</h1>
</div>

<div class="cmp-block">
    <form method="POST" action="/circulars/new" class="cmp-form" id="composeForm">
        <div class="cmp-scope-lock">
            <span class="cmp-dot"></span>
            Posting as {{ wing_label or "your Wing" }} (locked)
        </div>

        <div class="cmp-row">
            <label class="dt-caption">Title</label>
            <input type="text" name="new_title" required class="dt-input" placeholder="Circular title">
        </div>

        <div class="cmp-row">
            <label class="dt-caption">Content</label>
            <div id="editorMount"></div>
            <textarea name="new_content" id="editorSource" class="cmp-hidden-source" required></textarea>
        </div>

        <div class="cmp-row-split">
            <div class="cmp-row">
                <label class="dt-caption">Classification</label>
                <select name="new_classification" class="dt-select">
                    <option value="For Information">For information</option>
                    <option value="For Action">For action</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="cmp-row">
                <label class="dt-caption">Tags</label>
                <input type="text" name="new_tags" class="dt-input" placeholder="e.g. roadworks, safety">
            </div>
        </div>

        <input type="hidden" name="submit_circular" value="1">
        <button type="submit" class="dt-btn-primary">Publish &rarr;</button>
    </form>
</div>

</div>

<script src="/assets/dohw_intranet/js/editor.bundle.js?v=2"></script>
<script>
window.DoWHEditor.init({
    root: document.getElementById('editorMount'),
    source: document.getElementById('editorSource'),
    placeholder: 'Circular content',
    initialContent: ''
});
</script>
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/assets/dohw_intranet/css/editor.css">
<style>
/* Page-specific layout not covered by the shared tokens.css/navigation.css
   foundation — see docs/design/content-mgmt.md for the decision record.
   The content editor is TipTap (editor.bundle.js + editor.css), replacing the
   earlier contenteditable+execCommand hack. */

.cmp-page { max-width: 560px; }
.cmp-block + .cmp-block { margin-top: var(--space-5, 20px); }
.cmp-crumb { margin-bottom: 6px; }
.cmp-crumb a { color: var(--ink-muted, #7c7c7c); text-decoration: none; }
.cmp-crumb a:hover { color: var(--ink, #171717); }

.cmp-scope-lock {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-sans);
    font-size: 11.5px; padding: 6px 10px; border: 1px solid var(--border, #ededed);
    border-radius: 20px; background: #fafafa; color: var(--ink-secondary, #666); margin-bottom: var(--space-4, 16px);
}
.cmp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dowh-gold); }

.cmp-form { display: flex; flex-direction: column; gap: 14px; }
.cmp-row { display: flex; flex-direction: column; gap: 4px; }
.cmp-row-split { display: flex; gap: 12px; }
.cmp-row-split .cmp-row { flex: 1; }

.cmp-hidden-source { display: none; }

@media (max-width: 500px) {
    .cmp-row-split { flex-direction: column; }
}
</style>
{% endblock %}
